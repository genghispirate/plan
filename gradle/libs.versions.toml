# =============================================================================
#  HAVEN · Version Catalog (single declarative source of truth)
#  All module build scripts resolve dependencies exclusively through this file.
#  Offline-first: NO third-party cloud SDKs. WebDAV sync is self-hosted only
#  (plain OkHttp against the user's own server).
# =============================================================================

[versions]
# ---- Build tooling --------------------------------------------------------
agp                     = "8.7.3"
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"

# ---- AndroidX core --------------------------------------------------------
coreKtx                 = "1.15.0"
appcompat               = "1.7.0"
lifecycle              = "2.8.7"
activityCompose        = "1.9.3"
navigationCompose      = "2.8.5"
splashscreen           = "1.0.1"

# ---- Compose --------------------------------------------------------------
composeBom             = "2024.12.01"

# ---- Persistence & background --------------------------------------------
room                   = "2.6.1"
workManager            = "2.10.0"
datastore              = "1.1.1"

# ---- Health & sensors -----------------------------------------------------
healthConnect          = "1.1.0-alpha10"

# ---- Serialization & concurrency -----------------------------------------
kotlinxSerialization   = "1.7.3"
coroutines             = "1.9.0"

# ---- Security (encrypted local backups) ----------------------------------
securityCrypto         = "1.1.0-alpha06"

# ---- Dependency injection -------------------------------------------------
hilt                   = "2.53.1"
hiltAndroidx           = "1.2.0"

# ---- Networking (self-hosted WebDAV only) --------------------------------
okhttp                 = "4.12.0"

# ---- Runtime permission helpers ------------------------------------------
accompanist            = "0.36.0"

# ---- Testing --------------------------------------------------------------
junit                  = "4.13.2"
androidxJunit          = "1.2.1"
espresso               = "3.6.1"
coroutinesTest         = "1.9.0"

[libraries]
# ---- Core / lifecycle -----------------------------------------------------
androidx-core-ktx              = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat             = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process     = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose    = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-splashscreen          = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# ---- Compose (BOM-managed, versionless) ----------------------------------
androidx-compose-bom           = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui            = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation    = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation     = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics" }
androidx-compose-material3     = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ---- Room -----------------------------------------------------------------
androidx-room-runtime          = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx              = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler         = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ---- WorkManager ----------------------------------------------------------
androidx-work-runtime-ktx      = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ---- DataStore (circadian / onboarding prefs) ----------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ---- Health Connect -------------------------------------------------------
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# ---- Kotlinx --------------------------------------------------------------
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- Security -------------------------------------------------------------
androidx-security-crypto       = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ---- Hilt DI --------------------------------------------------------------
hilt-android                   = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltAndroidx" }
androidx-hilt-work             = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltAndroidx" }
androidx-hilt-compiler         = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltAndroidx" }

# ---- Networking (WebDAV) --------------------------------------------------
okhttp                         = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ---- Runtime permissions --------------------------------------------------
accompanist-permissions        = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# ---- Testing --------------------------------------------------------------
junit                          = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core         = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-room-testing          = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-testing          = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

[bundles]
# Cohesive dependency groups keep app/build.gradle.kts terse & declarative.
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-animation",
    "androidx-compose-animation-graphics",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-process",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
networking = [
    "okhttp",
    "okhttp-logging",
]

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library", version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
